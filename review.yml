    status: 404
  - url: https://www.essentialenergy.com.au/.well-known/ai-plugin.json
    status: 404
  - url: https://www.essentialenergy.com.au/favicon.ico
    status: 200
    note: image/x-icon, 4079 bytes — used as the provider image.
  - url: https://developer.essentialenergy.com.au/
    status: NXDOMAIN
  - url: https://developers.essentialenergy.com.au/
    status: NXDOMAIN
  - url: https://api.essentialenergy.com.au/
    status: NXDOMAIN
  - url: https://docs.essentialenergy.com.au/
    status: NXDOMAIN
  - url: https://data.essentialenergy.com.au/
    status: NXDOMAIN
  - url: https://opendata.essentialenergy.com.au/
    status: NXDOMAIN
  - url: https://developer-stg.it.api.essentialenergy.com.au/
    status: NXDOMAIN
    note: >-
      Appeared in search results as an "Essential Energy - Developer Portal"
      (Azure API Management). Does not resolve as of 2026-07-27. Recorded as a
      dead lead, not as a portal.
  - url: https://developer.it.api.essentialenergy.com.au/
    status: NXDOMAIN
  - url: https://dapr.essentialenergy.com.au/
    status: 200
    note: >-
      "Essential Energy DAPR - Rosetta Data Portal" web application. HTML only.
      /api returned 404, /openapi.json 404, /swagger.json 404, /api-docs 404.
  - url: https://engage.essentialenergy.com.au/access-to-network-data
    status: 200
    note: >-
      Explains Network Information Portal access for ASPs, electrical
      contractors, councils and emergency services; describes ordering network
      data packages from the map. No API, fee schedule or agreement documented
      on the page.
  - url: https://essentialenergy.maps.arcgis.com/sharing/rest/portals/self?f=json
    status: 200
    note: >-
      ArcGIS Online org — id 3o0vFs4fJRsuYuBO, name "Essential Energy", urlKey
      "EssentialEnergy", access "public". Saved verbatim.
  - url: https://www.arcgis.com/sharing/rest/search?q=orgid:3o0vFs4fJRsuYuBO&f=json&num=100
    status: 200
    note: >-
      184 public items across the organisation (Feature Services, Web Maps,
      Dashboards, Web Mapping Applications, a Web Experience). Fully paginated
      and saved verbatim.
  - url: https://services-ap1.arcgis.com/3o0vFs4fJRsuYuBO/arcgis/rest/services?f=json
    status: 200
    note: >-
      Anonymous services directory, currentVersion 12, 100 FeatureServers. Saved
      verbatim. This is the de facto API surface.
  - url: https://services-ap1.arcgis.com/3o0vFs4fJRsuYuBO/arcgis/rest/services/HostingCapacity_Substation_GEN/FeatureServer/1/query?where=1%3D1&outFields=*&resultRecordCount=2&f=json
    status: 200
    note: >-
      Anonymous query succeeded and returned live field definitions and point
      features. Confirms the surface is queryable without credentials. (Layer id
      is 1, not 0 — querying /0/query returns an ArcGIS error object.)
  - url: https://services-ap1.arcgis.com/3o0vFs4fJRsuYuBO/arcgis/rest/services/EE_Service_Areas/FeatureServer/0/query?where=1%3D1&outFields=*&returnGeometry=false&resultRecordCount=3&f=json
    status: 200
    note: Anonymous query succeeded; returned service-area polygon schema.
  - url: https://services-ap1.arcgis.com/3o0vFs4fJRsuYuBO/arcgis/rest/services/EE_Service_Areas/OGCFeatureServer?f=json
    status: 200
    note: >-
      HTTP 200 but the body is an ArcGIS error object ({"error":{"code":400,
      "message":"Invalid URL"}}). /api and /collections behave identically. OGC
      API - Features is NOT enabled, so no standards-based OpenAPI document is
      available from these services.
  - url: https://data.nsw.gov.au/data/api/3/action/organization_show?id=essential-energy&include_datasets=true
    status: 200
    note: >-
      CKAN reports Essential Energy as a publisher with package_count 1. The one
      dataset is "StormTracker" (CC-BY), and its single resource is a "website
      link" to http://www.essentialenergy.com.au/content/stormtracker — not a
      data file and not an API.
  - url: https://api.cdr.gov.au/cdr-register/v1/energy/data-holders/brands/summary
    status: 200
    note: >-
      84 energy data-holder brands. No Essential Energy entry. See
      mandate.statusEvidence.
  - url: https://api.github.com/orgs/essential-energy
    status: 200
    note: >-
      A GitHub org named "Essential-Energy" exists but was created 2026-05-14
      with 0 public repos, no description, no blog and no location. There is no
      evidence linking it to the NSW distributor, so it is deliberately NOT
      recorded in apis.yml.
  - url: https://api.github.com/orgs/essentialenergy
    status: 404

