aid: essential-energy
name: Essential Energy
review:
  question: >-
    Does Essential Energy publish a public developer/API surface, and does the
    Australian Consumer Data Right energy mandate actually reach it?
  answer: >-
    Partly. Essential Energy publishes NO developer portal, NO consumer data API
    and NO OpenAPI/AsyncAPI/GraphQL contract. It does publish a genuinely open,
    anonymous, key-free ArcGIS REST geospatial API surface of 100 FeatureServers
    covering network assets, DER hosting capacity and regulated planning data.
    The CDR energy mandate does NOT apply to it — it is a distributor, not a
    retailer, and it does not appear in the public CDR energy data-holder brand
    register.
  date: '2026-07-27'
  reviewer: API Evangelist
  homeMarket: Australia
  tier: network-distributor

mandate:
  regime: none
  regimeNote: >-
    Essential Energy operates inside a market where a statutory consumer data
    mandate exists (the Consumer Data Right, extended to energy by the Consumer
    Data Right (Energy Sector) Designation 2020, administered by the ACCC with
    standards set by the Data Standards Body), but that obligation does not
    reach this organization. Under the CDR energy rules the designated data
    holders are electricity RETAILERS, with AEMO acting as the gateway that
    supplies standardised NMI standing data, DER register data and metering
    data. Distribution network service providers (DNSPs) such as Essential
    Energy, Ausgrid and Endeavour Energy are not designated CDR data holders and
    carry no CDR consumer-facing API obligation.
  status: not-applicable
  statusEvidence:
    - probe: >-
        GET https://api.cdr.gov.au/cdr-register/v1/energy/data-holders/brands/summary
        (header x-v: 1), anonymous, 2026-07-27
      httpStatus: 200
      result: >-
        84 energy data-holder brands returned. A case-insensitive search of the
        full JSON payload for the string "essential" returned ZERO matches.
        Every brand in the register is a retail energy brand (Origin Energy,
        AGL, EnergyAustralia, ENGIE, Alinta Energy, Aurora Energy, Powershop,
        Sumo Power, Kogan Energy, Arcline by RACV, Cooperative Power, RAA Energy
        and similar). No DNSP appears in the register.
      conclusion: >-
        Essential Energy is NOT a designated CDR energy data holder. This is a
        verified absence from the authoritative public register, not an
        inference from marketing copy.
  otherRegimes:
    greenButton: >-
      No Green Button / ESPI reference found anywhere on Essential Energy's
      surfaces. Green Button is a North American standard with no Australian
      adoption path here.
    smartMeterInfrastructure: >-
      Not applicable. Australia has no DCC-style central smart metering
      infrastructure body; metering data flows to AEMO from metering
      coordinators, and Essential Energy exposes no metering data API.
    regulatoryPublishingObligation: >-
      Essential Energy IS subject to a genuine regulatory PUBLISHING obligation
      that is not a consumer data right: the Australian Energy Regulator
      requires every distribution network service provider to publish a
      Distribution Annual Planning Report (DAPR). Essential Energy satisfies
      this with a human-readable Rosetta Data Portal web application at
      https://dapr.essentialenergy.com.au/ (HTTP 200, 2026-07-27) and with
      machine-queryable ArcGIS FeatureServer tables (DAPR_ZS_Summer_v2,
      DAPR_ZS_Winter_v2, DAPR_TX_Lines, NIP_ZS_Forecast,
      Distrib_Feeder_Fcasts). This is a publishing mandate, not a data-access
      right — no third party can obtain an individual customer's data through
      it.
  keyFinding: >-
    This organization is the clean negative control for the "is a data mandate
    replicable" question. Australia successfully transplanted its banking data
    mandate into energy — the register at api.cdr.gov.au proves 84 energy data
    holders exist and are listed — but the transplant was scoped to the RETAIL
    layer. The poles-and-wires distributor that physically owns the meters and
    the network sits entirely outside the mandate, and therefore ships no
    consumer data API at all. A mandate is only as wide as its designation
    instrument.

dataStandard:
  energyStandardImplemented: none
  note: >-
    No energy-sector data standard reference was found. No Green Button / ESPI,
    no CDR Consumer Data Standards (energy) schemas, no IEC CIM 61968/61970, no
    IEEE 2030.5, no OpenADR, no OCPP/OCPI (despite the EV charging suitability
    layers). The open surface conforms to the Esri ArcGIS REST API (currentVersion
    12 reported by the services directory) — a vendor de facto standard for
    geospatial services, not an energy standard. OGC API - Features was probed on
    the same services and is NOT enabled (see probes below), so there is no
    standards-based OpenAPI description available either.

consumerVsMarketDataSplit:
  consumerDataApi: false
  consumerDataNote: >-
    There is no documented API by which a third party can obtain an individual
    customer's electricity usage, billing or standing data from Essential
    Energy. Essential Energy is a distributor and has no retail billing
    relationship with end customers; the customer-facing energy contract, and
    therefore the CDR consumer-data obligation, sits with the retailer. No
    customer data endpoint, no consent flow and no accreditation gateway was
    found on any Essential Energy host.
  marketDataOpen: true
  marketDataNote: >-
    Genuinely open and anonymously machine-readable. Essential Energy operates a
    public ArcGIS Online organisation (org id 3o0vFs4fJRsuYuBO, urlKey
    "EssentialEnergy", access "public") whose REST services directory lists 100
    FeatureServers, all reachable without any credential. Verified anonymous
    queries returned live field schemas and features. Content covers physical
    network assets, DER hosting capacity, network planning forecasts and EV
    charging suitability. Separately, Essential Energy publishes exactly ONE
    dataset on Data.NSW (CKAN) — "StormTracker" — and that record is only a
    website link, not a data resource.
  theSplit: >-
    Wide open on grid/network data, completely closed on consumer data. The
    organization exposes the location, type and capacity of essentially every
    asset it owns, but nothing at all about the people connected to them — and
    that is not a policy choice about privacy so much as a consequence of where
    the CDR designation landed.

accessGate:
  gate: self-serve
  gated: false
  whatADeveloperMustDo: >-
    Nothing. There is no signup, no key, no application, no licence click-through
    and no partner agreement for the ArcGIS REST surface. A developer issues an
    anonymous HTTPS GET against
    https://services-ap1.arcgis.com/3o0vFs4fJRsuYuBO/arcgis/rest/services?f=json
    to enumerate the 100 services, then queries any layer, for example
    .../HostingCapacity_Substation_GEN/FeatureServer/1/query?where=1%3D1&outFields=*&f=json.
    Services report capabilities of "Query" or "Query,Extract" and a
    maxRecordCount of 2000. The one gated path is the ordering of formal network
    data PACKAGES (pole data, network routes) through the Network Information
    Portal, which Essential Energy positions for Accredited Service Providers,
    electrical contractors, councils and emergency services and which routes
    through a request/order workflow rather than an API.
  noDeveloperPortal: >-
    Essential Energy publishes no developer portal. developer., developers.,
    api., docs., data. and opendata..essentialenergy.com.au all return NXDOMAIN.
    A search result surfaced an Azure API Management developer portal at
    developer-stg.it.api.essentialenergy.com.au — that hostname no longer
    resolves (NXDOMAIN, 2026-07-27) and was in any case a staging host.

authModel:
  scheme: none
  note: >-
    Anonymous HTTPS. No API key, no OAuth 2.0, no OpenID Connect, no mTLS and no
    CDR accreditation applies to the public surface, because the public surface
    is unauthenticated read-only ArcGIS REST. /.well-known/openid-configuration
    returned HTTP 404 on www., dapr. and engage..essentialenergy.com.au. No
    authenticated Essential Energy API was discovered. The Network Information
    Portal ordering workflow and any ASP self-serve map application sit behind
    Esri/ArcGIS Online identity, which is a customer/partner login, not a
    published developer auth scheme.

