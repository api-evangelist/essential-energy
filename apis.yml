- aid: essential-energy:essential-energy-network-planning-feature-services
  name: Essential Energy Network Planning and DAPR Feature Services
  description: >-
    Anonymous ArcGIS REST FeatureServer tables and layers publishing Essential
    Energy's regulated network planning data — zone substation summer and winter
    ratings and forecasts (DAPR_ZS_Summer_v2, DAPR_ZS_Winter_v2, NIP_ZS_Forecast),
    transmission line data (DAPR_TX_Lines) and distribution feeder forecasts
    (Distrib_Feeder_Fcasts) derived from the Distribution Annual Planning Report
    that the Australian Energy Regulator requires every distributor to publish,
    plus EV charging point-of-interest and pole-suitability analysis layers. The
    human-readable DAPR is separately published through a Rosetta Data Portal
    web application, which exposes no API of its own.
  humanURL: https://dapr.essentialenergy.com.au/
