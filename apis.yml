- aid: essential-energy:essential-energy-hosting-capacity-feature-services
  name: Essential Energy Hosting Capacity Feature Services
  description: >-
    Anonymous ArcGIS REST FeatureServer endpoints publishing Essential Energy's
    distributed energy resource hosting capacity — how much generation (GEN) and
    load (LOAD) the network can absorb — at substation level and as 1km, 5km and
    15km hexbin aggregations, together with spare-capacity service areas and
    substation capacity layers. The service descriptions self-identify as
    "Hosting Capacity MVP – GEN dataset for Experience Builder" and "Hosting
    Capacity MVP – LOAD dataset for Experience Builder", and back the public
    network capacity map experience.
