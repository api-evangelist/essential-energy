name: Essential Energy
kind: company
description: >-
  Essential Energy is a New South Wales Government-owned statutory corporation and
  the distribution network service provider (DNSP) for 95 per cent of the geographic
  area of NSW plus parts of southern Queensland — the poles, wires, substations and
  streetlights, not the retail energy contract. Headquartered in Port Macquarie and
  formed in 2011 out of the restructure of Country Energy, it sits in the regulated
  network layer of the Australian electricity value chain alongside Ausgrid and
  Endeavour Energy, under Australian Energy Regulator economic regulation. Its API
  posture splits cleanly and the split is the finding: Essential Energy publishes NO
  consumer data API and NO developer portal, and it is NOT a designated data holder
  under the Consumer Data Right energy regime — the CDR energy obligation lands on
  electricity retailers and AEMO, not on distributors, and Essential Energy does not
  appear anywhere in the public CDR energy data-holder brand register. What it does
  publish, anonymously and without a key, is a genuinely open grid-data surface: an
  ArcGIS Online organisation exposing 100 public ArcGIS REST FeatureServers covering
  network assets (poles, spans, cables, transformers, substations, streetlights,
  service points), DER hosting capacity for generation and load, zone substation and
  distribution feeder forecasts from the Distribution Annual Planning Report, and EV
  charging suitability analysis. Open market and network data, closed consumer data.
