apis:
- aid: essential-energy:essential-energy-network-asset-feature-services
  name: Essential Energy Network Asset Feature Services
  description: >-
    Anonymous, key-free ArcGIS REST FeatureServer endpoints publishing Essential
    Energy's physical distribution network as queryable geospatial features —
    poles (timber, concrete, metal, composite), spans, cables, transformers,
    substations, zone substation sites, streetlights and controllers, service
    points, switchgear, fuses, reclosers, pillars, pits, towers, cross-arms,
    third-party attachments and the network service-area boundaries. Every
    service supports the standard ArcGIS REST /query operation over HTTPS GET
    with no authentication. These are the services backing Essential Energy's
    public Network Information Portal map viewer.
  humanURL: https://essentialenergy.maps.arcgis.com/apps/webappviewer/index.html?id=947af3fb3749427e97a4824dcbd49980
