shared_rules:
- No authentication on any call — anonymous HTTPS GET.
- Errors arrive with HTTP 200 and an {"error":{...}} body; always parse before trusting.
- Layer ids are per-service and arbitrary; read the FeatureServer descriptor first.
- maxRecordCount is 2000 on asset services and 1000 on the planning tables; page with resultOffset/resultRecordCount while exceededTransferLimit is true.
- The surface is read-only; never attempt applyEdits.
- No customer, NMI, account, consumption or billing data exists anywhere on this surface.
