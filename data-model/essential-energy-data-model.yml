absent_entities:
- name: Customer / Account / NMI
  note: >-
    No customer, account, National Metering Identifier, consumption, billing or consent
    entity exists anywhere on the public surface. PREMISE_CO on the substation and
    transformer layers is a premise COUNT, not a premise identifier — the aggregate is
    published, the individual never is. This absence is the structural expression of
    Essential Energy sitting outside the Consumer Data Right designation.
- name: Outage
  note: >-
    Live outage state is rendered on the corporate site's outage map but is not published
    as a FeatureServer in this organisation and has no queryable surface.
caveats:
- >-
  20 of 100 published FeatureServers were sampled. The remaining 80 are additional asset
  classes (switchgear, fuses, reclosers, pillars, pits, towers, cross-arms, earths, joints,
  enclosures and similar) that follow the same WACS_ID / Find_ID / _A / _S pattern.
- >-
  Every relationship here is inferred from shared column names. The services declare no
  relationship classes, no foreign keys and no relatedRecords, so a consumer must join
  client-side and validate the join themselves.
